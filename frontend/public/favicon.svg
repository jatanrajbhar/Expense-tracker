<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Ticket body -->
  <rect x="1" y="6" width="30" height="20" rx="2.5" fill="#fdfcf7" stroke="#1a1816" stroke-width="2"/>
  <!-- Punch hole (left stub) -->
  <circle cx="8.5" cy="16" r="3" fill="#d6d0c4" stroke="#1a1816" stroke-width="1"/>
  <!-- Perforation line -->
  <line x1="14" y1="7" x2="14" y2="25" stroke="#c4bbaa" stroke-width="1" stroke-dasharray="2.5,2"/>
  <!-- Rupee symbol -->
  <text x="23" y="21"
        font-family="'Courier New', monospace"
        font-size="13" font-weight="700"
        fill="#1a1816" text-anchor="middle">&#8377;</text>
</svg>
